name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  merge_group: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node_version: [20, 22, 24]
      fail-fast: false

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true
          runtime: node@${{ matrix.node_version }}

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

      # - name: Test
      #   run: pnpm run test

      - name: Typecheck
        run: pnpm typecheck
